name: CI

on:
  push:
  pull_request:

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # PostgreSQL et Redis comme en production : SQLite ignore certains verrous (select_for_update)
    # et un cache local masque les erreurs de partage entre processus.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keuria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/keuria
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check_parcours79
      - name: Génération et contrôle de fraîcheur du schéma OpenAPI
        run: |
          python manage.py spectacular --file schema.yml
          git diff --exit-code schema.yml || (echo "Erreur : le fichier schema.yml versionné n'est pas à jour par rapport aux routes du code. Exécutez 'python manage.py spectacular --file schema.yml' et commitez le schéma." && exit 1)
      - run: python -m ruff check .
      # Contrôles de déploiement avec une configuration de production réaliste : doit être sans aucun avertissement.
      - name: Contrôles de déploiement (check --deploy)
        env:
          DEBUG: "False"
          SECRET_KEY: ci-deploy-check-0123456789-0123456789-0123456789-0123456789-abcdef
          ALLOWED_HOSTS: keuria.example
          CORS_ALLOWED_ORIGINS: https://keuria.example
          CSRF_TRUSTED_ORIGINS: https://keuria.example
          EMAIL_HOST_USER: ci@keuria.example
          EMAIL_HOST_PASSWORD: ci-not-a-secret
          SECURE_SSL_REDIRECT: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Tests avec couverture
        run: |
          python -m coverage run -m pytest -q
          python -m coverage xml
          # Seuil de couverture : la CI échoue si elle passe sous 85 % (mesuré : 90 %).
          python -m coverage report --skip-covered --fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 0 erreur exigée ; la dette connue (any, règles React 19) reste visible en avertissements (eslint.config.mjs).
      - run: npm run lint
      # Interpréteur de blocs, logique et lecteur de leçons du parcours 7-9 (rejoue les leçons dans un navigateur simulé :
      # échoue si un enfant peut rester bloqué).
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  # Les images doivent se construire : un Dockerfile cassé ne doit pas être découvert le jour de la mise en ligne.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
