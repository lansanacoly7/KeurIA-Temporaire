name: Sécurité des dépendances

# Hebdomadaire (les vulnérabilités sont publiées sans que le code change) et à chaque modification des dépendances.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - backend/requirements*.txt
      - frontend/package-lock.json

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --strict

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Seules les dépendances livrées en production bloquent ; celles de développement sont signalées par Dependabot.
      - run: npm audit --omit=dev --audit-level=high
