name: CD (Déploiement Continu)

# Workflow prêt pour le déploiement. Déclenché manuellement (workflow_dispatch)
# ou lors de la publication d'un tag de version (v*.*.*).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible pour le déploiement"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      run_migrations:
        description: "Appliquer les migrations de base de données"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Validation des Images Conteneurs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validation du build Backend Docker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: keuria-backend:test

      - name: Validation du build Frontend Docker
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: keuria-frontend:test

  deploy:
    name: Déploiement sur le Serveur Cible
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérification des prérequis de déploiement (Secrets SSH)
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_SSH_HOST }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::Les secrets DEPLOY_SSH_HOST et DEPLOY_SSH_KEY ne sont pas encore renseignés. Le workflow est prêt et s'activera automatiquement dès leur saisie."
          fi

      - name: Déploiement sécurisé via SSH (si configuré)
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -eu
            cd /opt/keuria
            echo "==> Mise à jour du code source..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            echo "==> Reconstruction et redémarrage des conteneurs..."
            docker compose down --remove-orphans || true
            docker compose up -d --build
            
            if [ "${{ github.event.inputs.run_migrations || 'true' }}" = "true" ]; then
              echo "==> Application des migrations..."
              docker compose run --rm backend python manage.py migrate --noinput
            fi
            
            echo "==> Vérification de l'état de santé..."
            sleep 5
            docker compose exec -T backend python -c "import urllib.request; resp = urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5); assert resp.status == 200"
            echo "==> Déploiement terminé avec succès !"
