openapi: 3.0.3
info:
  title: kEur IA API
  version: 1.0.0
  description: Documentation OpenAPI 3.0 interactive des points d'accès de la plateforme
    éducative kEur IA (apprentissage de l'IA pour les enfants au Sénégal).
paths:
  /api/account/delete:
    post:
      operationId: account_delete_create
      description: POST /api/account/delete {password} — supprime le compte parent
        ET ceux de ses enfants.
      tags:
      - account
      responses:
        '200':
          description: No response body
  /api/account/export:
    get:
      operationId: account_export_retrieve
      description: GET /api/account/export — téléchargement JSON des données du compte
        connecté.
      tags:
      - account
      responses:
        '200':
          description: No response body
  /api/auth/activity:
    post:
      operationId: auth_activity_create
      description: |-
        POST /api/auth/activity — signal envoyé par l'interface quand la personne agit réellement (clic, saisie, retour sur l'onglet).

        Il remet à zéro le compte à rebours d'inactivité. Réponse 200 {active: bool} : `false` pour un visiteur non connecté
        (aucune erreur, les pages publiques peuvent l'appeler) ; 401 si la session vient d'expirer par inactivité.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: GET /api/auth/csrf — garantit la présence du cookie csrftoken.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve_2
      description: GET /api/auth/csrf — garantit la présence du cookie csrftoken.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/deactivate:
    post:
      operationId: auth_deactivate_create
      description: |-
        POST /api/auth/deactivate {password} — désactive le compte parent connecté et détruit la session.

        Le mot de passe est exigé (une session volée ne doit pas suffire à enfermer le propriétaire dehors).
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/deactivate/:
    post:
      operationId: auth_deactivate_create_2
      description: |-
        POST /api/auth/deactivate {password} — désactive le compte parent connecté et détruit la session.

