# Analyse SonarQube de kEur IA (voir docs/EXPLOITATION.md, section « Qualité du code »).
# Lancer depuis la racine du dépôt :
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$SONAR_TOKEN
# Le jeton ne se met JAMAIS dans ce fichier.
sonar.projectKey=keuria-v2
sonar.projectName=kEur IA
sonar.sourceEncoding=UTF-8

# Code applicatif. Les fichiers de travail, les données de leçon et le studio Scratch embarqué (code tiers) sont exclus.
sonar.sources=backend/apps,backend/keuria,frontend/app,frontend/lib
sonar.tests=backend/apps,backend/keuria,frontend/tests
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*.test.mjs,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/migrations/**,**/.next/**,**/dist/**,**/public/**,**/*.min.js,\
  frontend/app/lms-data.ts,frontend/app/curriculum-*.ts,frontend/app/daily-plan.ts,backend/apps/curriculum/data/**

# Couverture backend (générée par coverage.py, voir backend/.coveragerc).
sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
# Couverture frontend (node --test --experimental-test-coverage, voir « npm run test:coverage »).
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Les fichiers de données (programmes, leçons) répètent volontairement leur structure : ils ne comptent pas dans la duplication.
sonar.cpd.exclusions=frontend/app/lms-data.ts,frontend/app/curriculum-*.ts,frontend/app/daily-plan.ts,frontend/content/**
