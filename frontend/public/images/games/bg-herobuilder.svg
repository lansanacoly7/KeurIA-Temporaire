<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)" />
  
  <!-- Hero Elements -->
  <path d="M 200 400 L 400 100 L 600 400 Z" fill="#FFF" opacity="0.1" filter="url(#glass)" />
  <circle cx="400" cy="300" r="150" fill="#FFF" opacity="0.1" filter="url(#glass)" />
  
  <!-- Shield Power -->
  <g transform="translate(150, 150) scale(0.8)">
    <path d="M 50 0 L 100 20 L 100 60 C 100 90 75 115 50 130 C 25 115 0 90 0 60 L 0 20 Z" fill="#FCD34D" opacity="0.9" />
    <path d="M 50 20 L 80 35 L 80 60 C 80 80 65 95 50 105 C 35 95 20 80 20 60 L 20 35 Z" fill="#F59E0B" />
  </g>
  
  <!-- Hero Mask -->
  <g transform="translate(500, 150) scale(0.9)">
    <path d="M 0 50 Q 50 0 100 50 Q 150 100 150 150 Q 100 150 50 150 Q 0 150 0 50" fill="#10B981" opacity="0.8" />
    <ellipse cx="40" cy="80" rx="15" ry="10" fill="#FFF" />
    <ellipse cx="90" cy="80" rx="15" ry="10" fill="#FFF" />
  </g>
  
  <!-- Star Emblem -->
  <g transform="translate(350, 400) scale(1)">
    <polygon points="50,0 60,35 95,35 65,55 75,90 50,70 25,90 35,55 5,35 40,35" fill="#FCD34D" />
  </g>
</svg>
