<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  
  <!-- Abstract Data Elements -->
  <circle cx="200" cy="150" r="80" fill="#FFF" opacity="0.3" filter="url(#glass)" />
  <circle cx="600" cy="450" r="120" fill="#FFF" opacity="0.3" filter="url(#glass)" />
  
  <!-- Lock (Private) -->
  <g transform="translate(150, 100) scale(0.6)">
    <rect x="50" y="80" width="100" height="80" rx="20" fill="#F59E0B" />
    <path d="M 70 80 V 50 A 30 30 0 0 1 130 50 V 80" fill="none" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" />
    <circle cx="100" cy="120" r="12" fill="#FFF" />
    <rect x="96" y="120" width="8" height="20" fill="#FFF" />
  </g>
  
  <!-- Eye (Public) -->
  <g transform="translate(450, 350) scale(0.8)">
    <path d="M 0 50 Q 50 0 100 50 Q 50 100 0 50" fill="#FFF" opacity="0.8" />
    <circle cx="50" cy="50" r="20" fill="#3B82F6" />
    <circle cx="50" cy="50" r="8" fill="#1E3A8A" />
    <circle cx="56" cy="44" r="4" fill="#FFF" />
  </g>
  
  <!-- Data files floating -->
  <rect x="350" y="200" width="80" height="100" rx="10" fill="#FFF" opacity="0.7" transform="rotate(15 350 200)" />
  <path d="M 370 230 L 410 230 M 370 250 L 410 250 M 370 270 L 390 270" stroke="#10B981" stroke-width="6" stroke-linecap="round" transform="rotate(15 350 200)" />
  
  <rect x="500" y="100" width="70" height="90" rx="10" fill="#FFF" opacity="0.5" transform="rotate(-20 500 100)" />
  <circle cx="535" cy="145" r="15" fill="#F59E0B" transform="rotate(-20 500 100)" />
</svg>
