# kEur IA - reverse proxy nginx (Debian, déploiement natif sans conteneur)
#
# nginx n'a qu'une seule destination applicative : le frontend Next.js sur 127.0.0.1:3001.
# Next relaie lui-même /api/* vers Django sur 127.0.0.1:8100 (voir frontend/next.config.ts) :
# il n'y a pas de « location /api/ » à écrire ici.
# Seuls les logos d'école (/media/) sont servis directement depuis le disque, ce qui évite un
# aller-retour par Next puis Django (mettre alors SERVE_MEDIA=False dans backend/.env).
#
# Installation : /etc/nginx/sites-available/keuria.conf, puis lien dans sites-enabled/.
# Remplacer keuria.example.com par le domaine réel (4 occurrences).
# Procédure complète : docs/DEPLOIEMENT_DEBIAN_NGINX.md

upstream keuria_frontend {
    server 127.0.0.1:3001;
    # Connexions réutilisées : évite une poignée de main TCP par requête.
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name keuria.example.com;

    # Renouvellement du certificat (certbot --webroot) : doit rester en HTTP simple.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Forme compatible avec nginx 1.22 (Debian 12) comme avec les versions récentes.
    # Sur nginx >= 1.25 (Debian 13), la forme recommandée est « listen 443 ssl; » suivi de
    # « http2 on; » : le paramètre ci-dessous y est accepté mais signalé comme obsolète.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name keuria.example.com;

    ssl_certificate     /etc/letsencrypt/live/keuria.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keuria.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Pas d'agrafage OCSP : Let's Encrypt a arrêté son répondeur OCSP en 2025, la directive
    # n'ajouterait que des avertissements au démarrage.

    access_log /var/log/nginx/keuria.access.log;
    error_log  /var/log/nginx/keuria.error.log;

    # Le logo d'une école (2 Mo) peut arriver encodé en base64, soit ~2,7 Mo de corps JSON.
    # Django refuse au-delà de 4 Mo (DATA_UPLOAD_MAX_MEMORY_SIZE) : nginx coupe juste avant,
    # avec un 413 immédiat. Le défaut de nginx (1 Mo) casserait l'envoi d'un logo.
    client_max_body_size 5m;

    # Compression GZIP : divise par 3 à 4 le volume des CSS, JS, JSON et SVG transmis sur le réseau
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # Les en-têtes de sécurité (HSTS, CSP, X-Frame-Options, Permissions-Policy...) sont posés par
    # Next (frontend/next.config.ts) et traversent le proxy : ne pas les redéfinir ici, deux
    # valeurs concurrentes ne se cumulent pas.

    # Logos d'école : servis depuis le disque, sans passer par Next ni Django.
    # Suppose SERVE_MEDIA=False dans backend/.env, et un dossier lisible par www-data.
    location /media/ {
        alias /opt/keuria/backend/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # Un fichier absent ne doit pas partir vers l'application : 404 immédiat.
        try_files $uri =404;
    }

    location / {
        proxy_pass http://keuria_frontend;
        proxy_http_version 1.1;

        # Le domaine public, pour ALLOWED_HOSTS et les URL absolues de Next.
        proxy_set_header Host $host;

        # UNE seule entrée, celle du vrai client : Django lit la dernière valeur de
        # X-Forwarded-For (NUM_PROXIES=1) pour la limitation de débit et le blocage après
        # échecs de connexion. $remote_addr (et non $proxy_add_x_forwarded_for) écrase tout
        # en-tête envoyé par le client lui-même.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Indispensable : sans cet en-tête, Django (SECURE_SSL_REDIRECT) croit la requête en
        # HTTP simple et renvoie une redirection vers HTTPS... en boucle.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Vide : autorise la réutilisation des connexions vers l'upstream (keepalive ci-dessus).
        proxy_set_header Connection "";

        # Un peu au-delà du délai de gunicorn (60 s) : si une requête dure trop, l'erreur vient
        # de l'application (journalisée, avec son request_id) et non d'un 504 muet du proxy.
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
        proxy_redirect off;
    }
}
